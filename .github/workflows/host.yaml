
name: Deploy to Tomcat via Manager API

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Change to self-hosted when using your EC2 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build WAR using Maven
        run: mvn clean package -DskipTests

      - name: Deploy WAR to Tomcat
        run: |
          WAR_FILE=$(find target -maxdepth 1 -name '*.war' -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found"
            exit 1
          fi

          APP_NAME=Webapp-host

          curl --fail-with-body -sS \
            -u "${{ secrets.TOMCAT_USERNAME }}:${{ secrets.TOMCAT_PASSWORD }}" \
            --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/$APP_NAME&update=true"
